<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Input Data Mahasiswa</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body class="bg-light">
        <div class="container py-5">
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h4 class="card-title mb-3">Input Data</h4>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nama Lengkap</label>
                                <input type="text" id="nama" class="form-control" placeholder="Masukan Nama">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">NIM</label>
                                <input type="text" id="nim" class="form-control" placeholder="241110244">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Semester</label>
                                <input type="number" id="semester" class="form-control" placeholder="1-8" min="1" max="8">
                            </div>

                            <div class="mb-3">
                            <label class="form-label fw-bold">Program Studi</label>
                            <select id="prodi" class="form-select">
                                <option value="">-- Pilih Program Studi --</option>
                                <option value="Teknik Informatika">Teknik Informatika</option>
                                <option value="Sistem Informasi">Sistem Informasi</option>
                                <option value="Teknik Komputer">Teknik Komputer</option>
                                <option value="Manajemen Informatika">Manajemen Informatika</option>
                            </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Email</label>
                                <input type="email" id="email" class="form-control" placeholder="email@gmail.com">
                            </div>
                            <button class="btn btn-primary w-100" onclick="tambahData()">KIRIM DATA</button>
                        </div>
                    </div>
                </div>
                
        <div class="col-md-6">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h4 class="card-title">Informasi Pengiriman</h4>
                    <div class="p-3 bg-light border rounded mt-3">
                        <p>Isi data Mahasiswa dengan benar</p>
                        <p>Data ditampilkan di console</p>
                        <p>Data disimpan di array</p>
                        <p>Jumlah data di-update</p>
                        <p>Form akan kosong kembali</p>
                    </div>
                </div>
            </div>


        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-3">Tabel Data Mahasiswa</h4>
                <div class="table-responsive">
                    <table class="table table-bordered table-striped" id="tabelMahasiswa">
                        <thead class="table-dark text-center">
                            <tr>
                                <th>No</th>
                                <th>Nama</th>
                                <th>Info</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="js.js"></script>
</body>
</html>
